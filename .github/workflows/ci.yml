name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-start-period=30s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, curl, xml, zip, gd, pdo, pdo_mysql, sqlite3

      - name: Install dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Set up .env file
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=localhost/' .env
          sed -i 's/DB_DATABASE=your_database/DB_DATABASE=test_db/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=root/' .env

      - name: Prepare storage directories
        run: |
          php artisan storage:link
          chmod -R 777 storage bootstrap/cache

      - name: Migrate and Seed Database
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Run tests
        env:
          CI: "true"
        run: vendor/bin/phpunit --stop-on-failure --colors=always
